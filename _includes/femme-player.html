<!-- ===== FemMe Radio player (in the top bar, on every page) =====
     The music keeps playing when you move between the site's tabs:
     while it plays, links inside the site load the new page without reloading the whole page. -->
<!-- ===== FemMe Radio: the music player (invisible; the button is in the sidebar, under Github) =====
     It sits in the top bar, which stays the same on every page, so the music keeps playing
     when you move between the site's tabs. -->
<audio id="femmeAudio" preload="none"></audio>
<style>
  .femme-li { margin-top: .4em; }
  #femmeBtn { text-decoration: none; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: .35em; }
  #femmeBtn .femme-name { display: inline-flex; align-items: center; gap: .55em; color: #4b1d6e; font-weight: 600; }
  #femmeBtn .femme-pill { display: inline-block; margin-left: 1.9em; padding: .25em .9em; border-radius: 999px; background: #4b1d6e; color: #fff; font-size: .85em; font-weight: 600; }
  #femmeBtn:hover .femme-pill, #femmeBtn:focus-visible .femme-pill { background: #6a2a98; }
</style>
<script>
(function () {
  var SRC = "https://radio.femme-radio.gr/listen/femme_radio/radio.mp3";
  var API = "https://radio.femme-radio.gr/api/nowplaying/femme_radio";
  var a = document.getElementById("femmeAudio");
  var nowText = "";
  /* the button lives in the sidebar, which is replaced when the page changes: always look it up again */
  function btn() { return document.getElementById("femmeBtn"); }
  var n = { set textContent(t) { nowText = t || ""; var b = btn(); if (b) b.title = nowText || "FemMe Radio"; } };
  var l = { get innerHTML() { var x = document.getElementById("femmeLbl"); return x ? x.innerHTML : ""; },
            set innerHTML(h) { var x = document.getElementById("femmeLbl"); if (x) x.innerHTML = h; } };
  function relabel() { l.innerHTML = a.paused ? "&#9654; Listen live" : "&#10074;&#10074; Pause"; n.textContent = nowText; }
  var timer, opened = false;
  function playing() { return !a.paused; }
  function nowPlaying() {
    fetch(API).then(function (r) { return r.json(); }).then(function (d) {
      var s = d && d.now_playing && d.now_playing.song;
      if (s && playing()) n.textContent = "♪ " + (s.artist ? s.artist + " – " : "") + (s.title || "");
    }).catch(function () {});
  }
  function toggle() {
    if (a.paused) {
      a.src = SRC; a.play();
      l.innerHTML = "&#10074;&#10074; Pause";
      n.textContent = "FemMe Radio…"; nowPlaying(); timer = setInterval(nowPlaying, 20000);
      /* first time only: also open the FemMe Radio site in a new tab (it does not start playing by itself) */
      if (!opened) { opened = true; window.open("https://femme-radio.gr/en/?noplay#join", "_blank", "noopener"); }
    } else {
      a.pause(); a.removeAttribute("src"); a.load();
      l.innerHTML = "&#9654; Listen live"; n.textContent = ""; clearInterval(timer);
    }
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest("#femmeBtn")) { e.preventDefault(); toggle(); }
  });
  a.onerror = function () { if (l.innerHTML.indexOf("Pause") > -1) n.textContent = "Could not connect"; };

  /* --- Keep the music playing while moving between pages of this site --- */
  function swap(url, push) {
    return fetch(url).then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (html) {
      var doc = new DOMParser().parseFromString(html, "text/html");
      var newMain = doc.getElementById("main"), oldMain = document.getElementById("main");
      if (!newMain || !oldMain) throw 0;
      oldMain.replaceWith(document.importNode(newMain, true));
      document.title = doc.title;
      if (push) history.pushState({ femme: 1 }, "", url);
      window.scrollTo(0, 0);
      relabel();
      /* the theme's sidebar menu ("Follow" button on phones) needs to be set up again for the new page */
      if (window.jQuery) {
        var $ = window.jQuery;
        $(".author__urls-wrapper button").off("click").on("click", function () {
          $(".author__urls").fadeToggle("fast"); $(".author__urls-wrapper button").toggleClass("open");
        });
        if ($(window).width() >= 1024) $(".author__urls").css("display", "block");
      }
      /* run any scripts that came with the new page content */
      document.getElementById("main").querySelectorAll("script").forEach(function (old) {
        var s = document.createElement("script"); s.text = old.text; if (old.src) s.src = old.src; old.replaceWith(s);
      });
    });
  }
  document.addEventListener("click", function (e) {
    if (!playing() || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var link = e.target.closest && e.target.closest("a[href]");
    if (!link || link.target === "_blank" || link.hasAttribute("download")) return;
    var url = new URL(link.href, location.href);
    if (url.origin !== location.origin) return;
    if (/\.(pdf|zip|png|jpe?g|gif|mp3|mp4|docx?|pptx?)$/i.test(url.pathname)) return;
    if (url.pathname === location.pathname && url.hash) return;
    e.preventDefault();
    swap(url.href, true).catch(function () { location.href = url.href; });
  });
  window.addEventListener("popstate", function () {
    if (playing()) swap(location.href, false).catch(function () { location.reload(); });
  });
})();
</script>
